name: Build & Push Frontend -> GHCR

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE: ghcr.io/sara-donaduzzi/sara-web

jobs:
  build-and-push:
    name: Build e Push (Next.js)
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Login no GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Metadados da imagem
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build e Push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_API_URL=${{ secrets.NEXT_PUBLIC_API_URL }}
            NEXT_PUBLIC_APP_URL=${{ secrets.NEXT_PUBLIC_APP_URL }}
            NEXT_PUBLIC_APP_NAME=${{ secrets.NEXT_PUBLIC_APP_NAME }}
            NEXT_PUBLIC_APP_DESCRIPTION=${{ secrets.NEXT_PUBLIC_APP_DESCRIPTION }}
            NEXT_PUBLIC_MAX_FILE_SIZE=${{ secrets.NEXT_PUBLIC_MAX_FILE_SIZE }}
            NEXT_PUBLIC_ALLOWED_IMAGE_TYPES=${{ secrets.NEXT_PUBLIC_ALLOWED_IMAGE_TYPES }}
            NEXT_PUBLIC_ALLOWED_PDF_TYPES=${{ secrets.NEXT_PUBLIC_ALLOWED_PDF_TYPES }}
            NEXT_PUBLIC_ENABLE_NOTIFICATIONS=${{ secrets.NEXT_PUBLIC_ENABLE_NOTIFICATIONS }}
            NEXT_PUBLIC_ENABLE_PWA=${{ secrets.NEXT_PUBLIC_ENABLE_PWA }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max

      - name: Acionar deploy no Coolify
        if: success()
        env:
          WEBHOOK_URL: ${{ secrets.COOLIFY_WEBHOOK_URL }}
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
        run: |
          curl -fsSL \
            -X GET \
            "${WEBHOOK_URL}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"
